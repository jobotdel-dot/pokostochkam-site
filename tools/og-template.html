<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>og-image 1200×630</title>
<style>
  @page { size: 1200px 630px; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f6f7f4;
    color: #121a16;
    position: relative;
  }

  /* фон: мягкие пятна + точечная фактура, как на обложке сайта */
  .glow-a, .glow-b, .dots { position: absolute; pointer-events: none; }
  .glow-a {
    left: -160px; top: -260px; width: 900px; height: 700px;
    background: radial-gradient(closest-side, rgba(11, 107, 87, .20), transparent 70%);
  }
  .glow-b {
    right: -220px; bottom: -300px; width: 820px; height: 700px;
    background: radial-gradient(closest-side, rgba(169, 103, 15, .16), transparent 70%);
  }
  .dots {
    inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(11, 107, 87, .18) 1.4px, transparent 0);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(680px 420px at 88% 18%, #000 8%, transparent 76%);
    mask-image: radial-gradient(680px 420px at 88% 18%, #000 8%, transparent 76%);
  }

  .card {
    position: absolute;
    inset: 36px;
    border: 1px solid #e0e6e0;
    border-radius: 28px;
    background: linear-gradient(180deg, #ffffff, #f9faf8);
    box-shadow: 0 24px 48px -24px rgba(18, 26, 22, .28), 0 8px 16px -8px rgba(18, 26, 22, .08);
    padding: 52px 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  /* большой полупрозрачный знак справа */
  .bone {
    position: absolute;
    right: -132px;
    top: -128px;
    width: 430px;
    height: 430px;
    opacity: .1;
  }

  .brand { display: flex; align-items: center; gap: 16px; }
  .mark { width: 58px; height: 58px; border-radius: 16px; background: #0b6b57; display: grid; place-items: center; }
  .mark svg { width: 38px; height: 38px; }
  .brand .name { font-size: 30px; font-weight: 700; letter-spacing: -.8px; line-height: 1.1; }
  .brand .tag { font-size: 14px; color: #68756e; margin-top: 4px; }

  h1 {
    position: relative;
    margin: 0;
    font-size: 62px;
    line-height: 1.06;
    letter-spacing: -2.2px;
    font-weight: 700;
    max-width: 780px;
  }
  h1 em { font-style: normal; color: #0b6b57; }

  .foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: relative; }
  .chip {
    padding: 9px 16px;
    border: 1px solid #d9e4dd;
    border-radius: 999px;
    background: #eef5f1;
    color: #0b6b57;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -.1px;
  }
  .chip.sand { border-color: #f0d9ae; background: #fdf4e3; color: #a9670f; }
  .site { margin-left: auto; font-size: 17px; color: #68756e; letter-spacing: -.1px; }
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="dots"></div>

  <div class="card">
    <svg class="bone" viewBox="0 0 64 64" aria-hidden="true">
      <g fill="#0b6b57">
        <circle cx="17.5" cy="24.5" r="8"/>
        <circle cx="17.5" cy="39.5" r="8"/>
        <circle cx="46.5" cy="24.5" r="8"/>
        <circle cx="46.5" cy="39.5" r="8"/>
        <rect x="17.5" y="26.5" width="29" height="11" rx="5.5"/>
      </g>
    </svg>

    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g fill="#ffffff">
            <circle cx="17.5" cy="24.5" r="8"/>
            <circle cx="17.5" cy="39.5" r="8"/>
            <circle cx="46.5" cy="24.5" r="8"/>
            <circle cx="46.5" cy="39.5" r="8"/>
            <rect x="17.5" y="26.5" width="29" height="11" rx="5.5"/>
          </g>
        </svg>
      </div>
      <div>
        <div class="name">По косточкам</div>
        <div class="tag">для бухгалтеров и предпринимателей РФ</div>
      </div>
    </div>

    <h1>Сроки, ставки и расчёты —<br><em>по косточкам</em></h1>

    <div class="foot">
      <span class="chip">УСН · НДС · взносы</span>
      <span class="chip">Калькуляторы с формулами</span>
      <span class="chip sand">Сверка с первоисточником</span>
      <span class="site">jobotdel-dot.github.io</span>
    </div>
  </div>
</body>
</html>
